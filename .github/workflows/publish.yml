# Builds the site from the live public CV sheet, tests it, and publishes it
# to the gh-pages branch, which GitHub Pages serves. It runs on every push to
# main, and on demand: Actions -> "Refresh website data and publish" -> Run
# workflow, after the sheet is edited. There is deliberately no schedule.
#
# Two jobs. `build` fetches the data, runs every test and check, and uploads
# the tested _site/; it can only read the repository. `publish` runs only if
# `build` succeeded, and only on main: it downloads that _site/ and pushes it,
# unchanged, to gh-pages. A sheet that cannot be read, invalid data, or any
# failed test or check therefore stops the run before anything is published,
# and the site already live stays as it is. README.md ("Publishing and
# updates") describes the setup and the routine.
name: Refresh website data and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only unless a job says otherwise; see the publish job.
permissions:
  contents: read

# One run at a time, build and publish together: a new run waits until the
# one in progress has finished (a deploy in progress is never cancelled), so
# an older build can never publish after a newer one.
concurrency:
  group: publish-gh-pages
  cancel-in-progress: false

env:
  # R and knitr output depends on the locale: build in UTF-8.
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  # The Quarto release the site is built and tested with locally, installed
  # by both jobs. Change it deliberately, after testing locally (README.md).
  SITE_QUARTO_VERSION: 1.9.38

jobs:
  build:
    name: Build and test
    # A fixed image, not ubuntu-latest, so that the system the site is built
    # on changes only when this line is changed deliberately (README.md).
    runs-on: ubuntu-24.04
    # Locally (10 cores, tools installed) the steps take about 6 minutes, the
    # browser tests 3-5 of them. The runner has 4 cores and installs
    # everything first (the R packages come from a cache once a run has
    # succeeded), so expect 20-30 minutes. The limit leaves margin.
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      # No credentials are kept: nothing in this job writes to the repository.
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0
        with:
          version: ${{ env.SITE_QUARTO_VERSION }}

      # The R version recorded in renv.lock. Packages come as Linux binaries
      # from Posit Package Manager (the action's default on Linux).
      - name: Set up R
        uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          r-version: renv

      # Build headers for the two renv.lock packages that need a system
      # library when built from source: curl (libcurl) and fs (libuv). The
      # binaries normally need neither; this keeps a source build working.
      - name: Install system libraries for R packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev libuv1-dev

      - name: Restore the R packages (renv)
        uses: r-lib/actions/setup-renv@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm

      - name: Install Node packages
        run: npm ci

      - name: Install the browser for the browser tests
        run: npx playwright install --with-deps chromium

      # Reads the live public sheet. Fails, naming each bad record and field,
      # if the sheet cannot be read or any public record is invalid.
      - name: Fetch and validate the public sheet data
        run: Rscript scripts/build_data.R

      - name: R tests
        run: Rscript tests/testthat.R

      - name: JavaScript unit tests
        run: npm run test:unit

      - name: Render the site
        run: quarto render

      # The site is built from live data, so checks that need the fixtures'
      # special cases are relaxed (tests/e2e/support.mjs); every per-record
      # check still runs.
      - name: Browser tests
        id: browser-tests
        run: npx playwright test
        env:
          E2E_DATA: live

      # Only when the browser tests fail: their HTML report and traces, to
      # download from the run's summary page.
      - name: Upload the browser test report
        if: failure() && steps.browser-tests.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Verify the public output
        run: Rscript scripts/verify_generated_public_data.R

      # The last step, so it runs only when every check above has passed:
      # the tested _site/, handed to the publish job.
      - name: Upload the tested site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: _site
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish to GitHub Pages
    needs: build
    # Only from main: a run started on another branch builds and tests but
    # never publishes.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      # The only job that writes: it pushes the tested site to the gh-pages
      # branch with this job's GITHUB_TOKEN.
      contents: write
    steps:
      # Keeps this job's GITHUB_TOKEN in the git configuration (the default):
      # quarto publish pushes with git and never reads GITHUB_TOKEN itself.
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0
        with:
          version: ${{ env.SITE_QUARTO_VERSION }}

      - name: Download the tested site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: _site

      # Publishes that _site/ as it is (render: false), adding a .nojekyll
      # file so that GitHub Pages serves it unchanged. Nothing follows it.
      - name: Publish to GitHub Pages
        uses: quarto-dev/quarto-actions/publish@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0
        with:
          target: gh-pages
          render: false
